name: Deploy RailEye with public environment and soil evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install geospatial dependency
        run: python -m pip install --disable-pip-version-check pyproj==3.7.2
      - name: Validate original and delayed-soil logic
        run: |
          node --check app.js
          node --check live.js
          node --check hydro-core.js
          node --check hydro-ui.js
          node tests/smoke.cjs
          node tests/live-core.cjs
          node tests/hydro-core.cjs
          python -m unittest discover -s tests -p 'test_live*.py' -v
          python -m unittest discover -s tests -p 'test_soil.py' -v
      - name: Cache public source data only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .live-cache
            .soil-cache
          key: public-environment-soil-v2-${{ github.run_id }}
          restore-keys: public-environment-soil-v2-
      - name: Collect public environment snapshot
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/collect_live.py
      - name: Optional authorized CDS soil download
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          if [ -n "$CDSAPI_KEY" ]; then
            python -m pip install --disable-pip-version-check 'cdsapi>=0.7.7,<1' 'xarray>=2024.10' 'netCDF4>=1.7'
            timeout 260s python scripts/collect_era5_cds.py || echo 'CDS unavailable; use explicitly identified partial public source'
          else
            echo 'CDS_SOIL requires_configuration; no authenticated requests submitted'
          fi
      - name: Collect delayed ERA5-Land evidence and preserve source snapshots
        env:
          RAILEYE_CDS_NORMALIZED_DIR: .soil-cache/cds
        run: python scripts/collect_soil.py
      - name: Archive evidence versions for reproducible analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-evidence-${{ github.run_id }}
          path: evidence-archive/
          retention-days: 30
          if-no-files-found: error
      - name: Stage public site only
        run: |
          mkdir -p _site/data/live _site/data/soil
          cp index.html styles.css app.js live.css live-core.js live.js hydro.css hydro-core.js hydro-ui.js .nojekyll _site/
          cp data/live/*.json _site/data/live/
          cp data/soil/latest.json _site/data/soil/
          python scripts/prepare_hydro_site.py
          printf '{"version":"0.5.0","commit":"%s"}\n' "$GITHUB_SHA" > _site/build-info.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload public site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public release and actual soil evidence
        run: |
          python scripts/check_live_release.py
          python scripts/check_soil_release.py

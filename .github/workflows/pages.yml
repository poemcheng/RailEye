name: Deploy RailEye with public environment data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install geospatial dependency
        run: python -m pip install --disable-pip-version-check pyproj==3.7.2
      - name: Validate original and live-data logic
        run: |
          node --check app.js
          node --check live.js
          node tests/smoke.cjs
          node tests/live-core.cjs
          python -m unittest discover -s tests -p 'test_live*.py' -v
      - name: Cache public climatology and gauge metadata only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .live-cache
          key: public-environment-v1-${{ github.run_id }}
          restore-keys: public-environment-v1-
      - name: Collect actual public data with explicit failure states
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/collect_live.py
      - name: Stage public site only
        run: |
          mkdir -p _site/data/live
          cp index.html styles.css app.js live.css live-core.js live.js .nojekyll _site/
          cp data/live/*.json _site/data/live/
          printf '{"version":"0.4.0","commit":"%s"}\n' "$GITHUB_SHA" > _site/build-info.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload public site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public HTTPS release and actual snapshot
        run: python scripts/check_live_release.py
